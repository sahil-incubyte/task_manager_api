---
openapi: 3.0.1
info:
  title: Task Manager API
  version: v1
  description: RESTful API for managing tasks with JWT authentication
paths:
  "/signup":
    post:
      summary: Register a new user
      tags:
      - Authentication
      parameters: []
      responses:
        '201':
          description: user registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                required:
                - token
        '422':
          description: validation errors
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                password_confirmation:
                  type: string
              required:
              - name
              - email
              - password
              - password_confirmation
  "/login":
    post:
      summary: Authenticate user
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                required:
                - token
        '401':
          description: invalid credentials
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
  "/tasks":
    get:
      summary: List tasks with pagination, filtering, searching, and sorting
      tags:
      - Tasks
      security:
      - Bearer: []
      parameters:
      - name: page
        in: query
        required: false
        description: Page number
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: Items per page
        schema:
          type: integer
      - name: status
        in: query
        required: false
        enum:
        - todo
        - in_progress
        - completed
        - pending
        description: "Filter by status:\n * `todo` \n * `in_progress` \n * `completed`
          \n * `pending` \n "
        schema:
          type: string
      - name: priority
        in: query
        required: false
        enum:
        - 1
        - 2
        - 3
        description: Filter by priority
        schema:
          type: integer
      - name: search
        in: query
        required: false
        description: Search tasks by title
        schema:
          type: string
      - name: sort_by
        in: query
        required: false
        enum:
        - created_at
        - due_date
        - priority
        description: Sort field
        schema:
          type: string
      - name: order
        in: query
        required: false
        enum:
        - asc
        - desc
        description: Sort direction
        schema:
          type: string
      - name: due_before
        in: query
        format: date
        required: false
        description: Filter tasks due on or before date
        schema:
          type: string
      - name: due_after
        in: query
        format: date
        required: false
        description: Filter tasks due on or after date
        schema:
          type: string
      responses:
        '200':
          description: tasks listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Task"
                  meta:
                    "$ref": "#/components/schemas/PaginationMeta"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    post:
      summary: Create a new task
      tags:
      - Tasks
      security:
      - Bearer: []
      parameters: []
      responses:
        '201':
          description: task created
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    "$ref": "#/components/schemas/Task"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: validation errors
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                task:
                  type: object
                  properties:
                    title:
                      type: string
                    description:
                      type: string
                    status:
                      type: string
                      enum:
                      - todo
                      - in_progress
                      - completed
                      - pending
                    priority:
                      type: integer
                    due_date:
                      type: string
                      format: date
                  required:
                  - title
                  - status
              required:
              - task
  "/tasks/{id}":
    get:
      summary: Get a specific task
      tags:
      - Tasks
      security:
      - Bearer: []
      parameters:
      - name: id
        in: path
        required: true
        description: Task ID
        schema:
          type: integer
      responses:
        '200':
          description: task found
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    "$ref": "#/components/schemas/Task"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: task not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    patch:
      summary: Update a task
      tags:
      - Tasks
      security:
      - Bearer: []
      parameters:
      - name: id
        in: path
        required: true
        description: Task ID
        schema:
          type: integer
      responses:
        '200':
          description: task updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    "$ref": "#/components/schemas/Task"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: task not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: validation errors
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                task:
                  type: object
                  properties:
                    title:
                      type: string
                    description:
                      type: string
                    status:
                      type: string
                      enum:
                      - todo
                      - in_progress
                      - completed
                      - pending
                    priority:
                      type: integer
                    due_date:
                      type: string
                      format: date
              required:
              - task
    delete:
      summary: Delete a task
      tags:
      - Tasks
      security:
      - Bearer: []
      parameters:
      - name: id
        in: path
        required: true
        description: Task ID
        schema:
          type: integer
      responses:
        '204':
          description: task deleted
        '401':
          description: unauthorized
        '404':
          description: task not found
servers:
- url: http://localhost:3000
  description: Development server
components:
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
      description: 'Enter: Bearer <your_jwt_token>'
  schemas:
    Task:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - todo
          - in_progress
          - completed
          - pending
        priority:
          type: integer
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - title
      - status
      - created_at
      - updated_at
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: integer
        per_page:
          type: integer
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
    ValidationErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
